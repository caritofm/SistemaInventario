<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="dashboard" *ngIf="usuarioRol==='admin'">
            <div class="dashboard-container">
            <h4 class="dashboard-title">Hola {{usuarioNombre}} Bienvenid{{'@'}}</h4>

                    <div class="card yellow">
                    <i class="fas fa-box"></i>
                    <h3>Productos</h3>
                    <p>{{ totalProductos }}</p>
                    </div>

                    <div class="card green">
                    <i class="fas fa-arrow-left"></i>
                    <h3>Entradas</h3>
                    <p>{{entradaTotal}}</p>
                    </div>

                    <div class="card red">
                    <i class="fas fa-arrow-right"></i>
                    <h3>Salidas</h3>
                    <p>{{ totalSalida }}</p>
                    </div>

                    <div class="card red">
                    <i class="fas fa-arrow-right"></i>
                    <h3 routerLink="/ver-solicitud">Solicitudes</h3>
                    <p>{{ totalPendientes}}</p>
                    </div>
                </div>
    </div>
    <div class="dashboard" *ngIf="usuarioRol === 'gestor'">
        <h4 class="dashboard-title" >Hola, {{usuarioNombre}} Bienvenid{{'@'}} </h4>
    </div>

        <app-notificacion></app-notificacion>
    
    </div>


</body>
</html>
