<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="table.container">
        <table class="ubicacion-table">
            <thead>
                <tr>
                <th>Ubicacion</th>
                <th>Producto</th>
                <th>Categoria</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let u of ubicacion">
                <td>{{u.nombreUbicacion}}</td>
                <td>{{u.descripcion}}</td>
                <td>{{u.categoria?.nombreCategoria}}</td>
               
                </tr>
            </tbody>
        </table>

    </div>
    

</body>
</html>
