<h2 mat-dialog-title>Eliminar Producto</h2>
<mat-dialog-content>
  ¿Esta seguro de que desea eliminarlo?
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close (click)="eliminarProducto()">Aceptar</button>
  <button mat-button mat-dialog-close cdkFocusInitial (click)="cancelar()">Cancelar</button>
</mat-dialog-actions>
